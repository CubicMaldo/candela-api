# .air.toml — Configuración de Air (hot reload)

root = "."
tmp_dir = "tmp"

[build]
  # Comando de build
  cmd = "go build -buildvcs=false -o ./tmp/nomad-api ./cmd/server"
  # Binario resultante
  bin = "./tmp/nomad-api"
  # Argumentos al ejecutar
  args_bin = []
  # Qué archivos observar
  include_ext = ["go", "tpl", "tmpl"]
  # Qué ignorar
  exclude_dir = ["tmp", "vendor", "db/migrations"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  # Retraso antes de rebuild (ms) — evita rebuilds por guardados múltiples
  delay = 1000
  # Matar el proceso anterior antes de iniciar el nuevo
  kill_delay = "200ms"
  send_interrupt = false
  stop_on_error = false

[log]
  time = false
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
