version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations/000001_init.up.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repo/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
